<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Demande d'accès — Blackwell & Co Capital</title>
<link rel="stylesheet" href="/site/site.css"/>
</head>
<body>
<div class="site-header">
  <div class="site-logo"><a href="/" style="color:inherit; text-decoration:none;">Blackwell &amp; Co Capital</a></div>
  <div class="site-nav"><a href="/login">Se connecter</a></div>
</div>

<div class="site-form-shell">
  <h1>Demande de création de compte</h1>
  <p class="sub">Votre compte sera examiné par l'administrateur avant activation.</p>
  <div id="register-error" class="site-form-error"></div>
  <div id="register-success" class="site-form-success"></div>
  <div id="register-form">
    <div class="site-form-row"><label>Prénom</label><input id="reg-firstname" type="text"/></div>
    <div class="site-form-row"><label>Nom</label><input id="reg-lastname" type="text"/></div>
    <div class="site-form-row"><label>Email</label><input id="reg-email" type="email" autocomplete="username"/></div>
    <div class="site-form-row"><label>Mot de passe</label><input id="reg-password" type="password" autocomplete="new-password"/></div>
    <div class="site-form-row"><label>Département visé</label><select id="reg-dept"></select></div>
    <div class="site-form-row"><label>Grade visé</label><select id="reg-grade"></select></div>
    <button id="register-submit" class="site-btn">Envoyer la demande</button>
  </div>
  <div class="site-form-footer">Déjà un compte ? <a href="/login">Se connecter</a></div>
</div>

<script>
  async function loadOptions() {
    const res = await fetch("/api/roster-options");
    const data = await res.json();
    const deptSelect = document.getElementById("reg-dept");
    const gradeSelect = document.getElementById("reg-grade");
    data.departments.forEach(d => deptSelect.appendChild(new Option(d, d)));
    data.grades.forEach(g => gradeSelect.appendChild(new Option(g, g)));
  }
  loadOptions();

  document.getElementById("register-submit").addEventListener("click", async () => {
    const errEl = document.getElementById("register-error");
    const successEl = document.getElementById("register-success");
    errEl.textContent = "";
    successEl.textContent = "";
    const payload = {
      firstName: document.getElementById("reg-firstname").value,
      lastName: document.getElementById("reg-lastname").value,
      email: document.getElementById("reg-email").value,
      password: document.getElementById("reg-password").value,
      deptRequested: document.getElementById("reg-dept").value,
      gradeRequested: document.getElementById("reg-grade").value
    };
    if (!payload.firstName || !payload.lastName || !payload.email || !payload.password) {
      errEl.textContent = "Tous les champs sont requis.";
      return;
    }
    try {
      const res = await fetch("/register", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      if (!data.ok) { errEl.textContent = data.reason || "Demande refusée."; return; }
      successEl.textContent = "Demande envoyée ! Votre compte est en attente d'approbation par l'administrateur.";
      document.getElementById("register-form").style.display = "none";
    } catch (e) {
      errEl.textContent = "Erreur réseau — réessayez.";
    }
  });
</script>
</body>
</html>
